const soalData = [{ soal: "Kalimat yang tepat untuk menyampaikan saran dalam suatu diskusi adalah ...", opsi: ["Saudara penyaji, sebaiknya kita mencari jalan keluar agar minat baca di kalangan siswa terus meningkat", "Saya sangat setuju kalau siswa diberi kewajiban membaca sebuah buku yang harus diselesaikan dua minggu", "Semua guru memiliki kewajiban menyukseskan gerakan giat membaca", "Peran orang tua sangat besar untuk menyukseskan gerakan giat membaca, karena membaca merupakan jendela pengetahuan"], jawaban: 0 },
    { soal: "Hal yang perlu dikerjakan oleh seorang narasumber dalam diskusi tertera di bawah ini, kecuali ...", opsi: ["Menjawab tanggapan-tanggapan peserta diskusi", "Membuat notulen tentang jalannya seminar", "Menyampaikan salam pembukaan", "Tidak membacakan makalah karena telah dibagikan sebelumnya"], jawaban: 1 },
    { soal: "Berikut ini merupakan tujuan teks diskusi, kecuali ...", opsi: ["Menyampaikan gagasan dan argumen dari semua sisi dievaluasi sebelum menentukan keputusan.", "Menyajikan pendapat, sudut pandang, atau perspektif yang sama terhadap suatu permasalahan.", "Memaparkan pendapat terhadap suatu gagasan dari dua sisi, yang mendukung dan yang bertentangan.", "Menguji topik yang kontroversial, menggunakan argumen dari berbagai sudut pandang."], jawaban: 1 },
    { soal: "Seseorang yang akan menyampaikan pendapat perlu mengingat beberapa hal berikut, kecuali ...", opsi: ["Menggunakan fakta, ilustrasi, contoh, dan kesaksian", "Menyajikan dengan menarik, baik isi maupun bahasanya", "Menggunakan kecepatan tinggi dan memberikan penekanan pada bagian penting", "Menyampaikan dengan jelas, sistematis, dan logis"], jawaban: 2 },
    { soal: "Yang merupakan tujuan dari sebuah teks diskusi adalah ...", opsi: ["Mencapai kesepakatan gagasan atau pendapat, diskusi melibatkan kelompok", "Menyampaikan informasi faktual dan nyata", "Menyampaikan informasi faktual dan nyata", "Mengulas atau evaluasi karya sastra dan non sastra"], jawaban: 0 },
    { soal: "Jika hendak mengungkapkan pendapat dalam suatu diskusi, perlu dilakukan persiapan seperti yang tertera pada pernyataan di bawah ini, kecuali ...", opsi: ["Mempelajari masalah yang akan didiskusikan.", "Melengkapi pengetahuan kita mengenai masalah tersebut dengan membaca buku, majalah, surat kabar, dan berita di media elektronik.", "Membuat rangkuman tentang masalah yang dibicarakan dengan lengkap dalam urutan yang padat.", "Latihan vokal sebelum hadir di forum diskusi."], jawaban: 3 },
    { soal: "Bacalah teks berikut!\n\nHandphone dan Anak-Anak\n\nHandphone atau orang-orang sekarang lebih sering menggunakan smartphone adalah sebuah perangkat yang digunakan untuk mempermudah manusia dalam urusan komunikasi. Tidak hanya komunikasi saja, smartphone juga digunakan untuk membantu keperluan manusia lainnya. Hampir setiap orang memiliki HP, termasuk anak kecil sekalipun. Walaupun begitu, banyak terjadi pro dan kontra dalam hal pemberian HP untuk anak-anak.\n\nPihak yang mendukung atau pihak yang pro terhadap pemberian HP kepada anak-anak menganggap bahwa dengan adanya alat komunikasi ini, orang tua menjadi lebih mudah dalam memantau dan mengawasi kondisi anaknya kapan pun dan di mana pun. Selain itu, dengan adanya HP atau smartphone membuat anak lebih mudah mengakses informasi-informasi yang mereka butuhkan dalam menunjang proses pembelajaran di sekolah.\n\nPihak yang kontra atau pihak yang menentang, pemberian HP untuk anak-anak beralasan bahwa anak anak belum saatnya untuk diberikan teknologi yang canggih ini. Alasannya, tidak semua informasi-informasi di internet itu baik, banyak pula konten berbahaya yang tidak boleh diakses oleh anak-anak. Selain itu, dengan memberikan HP kepada anak-anak membuat ia menjadi pribadi yang pasif dan susah bergaul dengan lingkungan sekitar karena lebih asyik bermain game di HP nya.\n\nBerdasarkan kedua argumen pro dan kontra, kesimpulan yang dapat diambil adalah bahwa pemberian HP untuk anak-anak sebenarnya tidak wajib. Namun, jika memang sangat diperlukan, orang tua harus memberikan pengawasan ketat kepada anaknya. Orang tua harus mengetahui apa saja yang diakses oleh anaknya dan selalu mengingatkan akan hal baik yang boleh diakses dan hal buruk yang tidak boleh diakses agar tidak terjerumus ke hal-hal yang negatif.\n\nTujuan penulis dalam teks diskusi tersebut adalah ...", opsi: ["Orang tua dilarang memberikan HP kepada anaknya.", "Memberikan pandangan terkait penggunaan HP untuk anak.", "Anak tidak boleh menggunakan HP untuk mencari informasi.", "Tidak ada yang perlu dikhawatirkan tentang penggunaan HP bagi anak."], jawaban: 1 },
    { soal: "Bacalah teks berikut!\n\nHandphone dan Anak-Anak\n\nHandphone atau orang-orang sekarang lebih sering menggunakan smartphone adalah sebuah perangkat yang digunakan untuk mempermudah manusia dalam urusan komunikasi. Tidak hanya komunikasi saja, smartphone juga digunakan untuk membantu keperluan manusia lainnya. Hampir setiap orang memiliki HP, termasuk anak kecil sekalipun. Walaupun begitu, banyak terjadi pro dan kontra dalam hal pemberian HP untuk anak-anak.\n\nPihak yang mendukung atau pihak yang pro terhadap pemberian HP kepada anak-anak menganggap bahwa dengan adanya alat komunikasi ini, orang tua menjadi lebih mudah dalam memantau dan mengawasi kondisi anaknya kapan pun dan di mana pun. Selain itu, dengan adanya HP atau smartphone membuat anak lebih mudah mengakses informasi-informasi yang mereka butuhkan dalam menunjang proses pembelajaran di sekolah.\n\nPihak yang kontra atau pihak yang menentang, pemberian HP untuk anak-anak beralasan bahwa anak anak belum saatnya untuk diberikan teknologi yang canggih ini. Alasannya, tidak semua informasi-informasi di internet itu baik, banyak pula konten berbahaya yang tidak boleh diakses oleh anak-anak. Selain itu, dengan memberikan HP kepada anak-anak membuat ia menjadi pribadi yang pasif dan susah bergaul dengan lingkungan sekitar karena lebih asyik bermain game di HP nya.\n\nBerdasarkan kedua argumen pro dan kontra, kesimpulan yang dapat diambil adalah bahwa pemberian HP untuk anak-anak sebenarnya tidak wajib. Namun, jika memang sangat diperlukan, orang tua harus memberikan pengawasan ketat kepada anaknya. Orang tua harus mengetahui apa saja yang diakses oleh anaknya dan selalu mengingatkan akan hal baik yang boleh diakses dan hal buruk yang tidak boleh diakses agar tidak terjerumus ke hal-hal yang negatif.\n\nInformasi yang dibahas pada paragraf kedua adalah ...", opsi: ["Pihak yang mendukung atau pihak yang pro terhadap pemberian HP.", "Pemberian HP untuk anak tidak wajib, tetapi juga boleh asal dengan pengawasan ketat.", "Orang-orang sekarang lebih sering menggunakan smartphone.", "Pihak yang kontra atau pihak yang menentang pemberian HP."], jawaban: 0 },
    { soal: "Perhatikan langkah-langkah berikut!\n1. Mengumpulkan data atau fakta pendukung\n2. Memilih tema atau isu aktual\n3. Menyusun kerangka teks diskusi\n4. Mengembangkan kerangka menjadi karangan utuh\n\nUrutan yang tepat dalam menyusun atau menulis teks diskusi adalah ...", opsi: ["1 - 2 - 3 - 4", "2 - 1 - 3 - 4", "2 - 3 - 1 - 4", "3 - 2 - 1 - 4"], jawaban: 1 },
    { soal: "Dalam tahap awal penulisan teks diskusi, pemilihan tema atau isu yang diangkat harus memenuhi syarat utama, yaitu ...", opsi: ["Bersifat subjektif dan hanya memihak satu sisi", "Merupakan masalah pribadi penulis", "Dapat menimbulkan dua pendapat yang berbeda atau pro dan kontra", "Hanya membahas topik yang sudah usang dan selesai dibahas"], jawaban: 2 },
    { soal: "Dalam sebuah diskusi, pihak yang bertugas memaparkan materi, gagasan, atau argumen utama terkait isu yang dibahas adalah ...", opsi: ["Moderator", "Notulis", "Narasumber", "Audiens"], jawaban: 2 },
    { soal: "Perhatikan pernyataan berikut ini!\n1. Mencatat jalannya diskusi\n2. Mencatat pertanyaan, tanggapan, dan kesimpulan\n3. Menyusun laporan hasil akhir diskusi\n\nPernyataan tersebut merupakan tugas dari seorang ...", opsi: ["Narasumber", "Notulen", "Notulis", "Peserta"], jawaban: 2 },
    { soal: "Orang yang bertugas memimpin jalannya diskusi, mengatur waktu, serta menjaga agar suasana diskusi tetap kondusif dan terarah adalah ...", opsi: ["Moderator", "Notulis", "Peserta", "Narasumber"], jawaban: 0 },
    { soal: "Bacalah paragraf di bawah ini dengan seksama!\n\nPemerintah akan memantau harga-harga kebutuhan bahan pokok di pasaran pada saat menjelang dan selama bulan ramadhan. Hal ini dilakukan untuk mencegah tindakan-tindakan nakal para pedagang yang menjual dengan harga yang sangat tinggi. Jika harga bahan pokok di pasaran melonjak, maka pemerintah akan bertindak dengan melakukan operasi pasar.\n\nKalimat kritik yang tepat pada isi paragraf di atas adalah ...", opsi: ["Pemerintah seharusnya memantau harga barang pokok tidak hanya selama bulan Ramadhan", "Pemerintah harus menurunkan harga bahan pokok selama bulan ramadhan", "Pemerintah seharusnya menindak para pedagang yang berlaku curang", "Pemerintah harus mengadakan operasi pasar selama bulan Ramadhan"], jawaban: 0 },
    { soal: "Kalimat tepat untuk menyanggah pendapat adalah ...", opsi: ["Hasil analisis saudara tidak dapat dipertanggungjawabkan karena faktanya bertentangan dengan kenyataan", "Fakta yang Anda sampaikan tidak benar. Jadi, buat apa saya menyetujui analisis Anda?", "Pendapat ini tidak masuk akal dan aneh sehingga Anda tidak perlu melakukan analisis lagi.", "Pendapat Anda mungkin benar, tetapi ada beberapa alasan dan bukti yang perlu Anda teliti lagi."], jawaban: 3 },
    { soal: "Kalimat tepat yang merupakan pernyataan persetujuan adalah ...", opsi: ["Saya sependapat dengan Anda karena internet memiliki ruang tidak terbatas", "Pendapat Anda sedikit berlebihan dan tidak masuk akal", "Saya setuju dengan pendapat Anda karena saya cocok dengan Anda", "Internet merupakan sarana lebih banyak berdampak buruk bagi perkembangan anak."], jawaban: 0 },
    { soal: "Aplikasi cerpen berbasis web dapat ditemukan dalam aplikasi android. Koleksi cerpen tersebut selalu terbaru. Untuk menjalankan aplikasi ini, pengguna harus terhubung dengan internet. Oleh karena itu, pengguna harus berlangganan paket data untuk mengaktifkan aplikasi tersebut. Pelajar akan sangat terbebani hal tersebut karena mereka harus menyisihkan uang jajan agar bisa berlangganan aplikasi tersebut. Biaya yang harus mereka keluarkan ini tentu jadi masalah bagi mereka, terlebih bagi pelajar di golongan menengah ke bawah.\n\nKalimat sanggahan yang tepat dan santun sesuai topik masalah tersebut adalah ...", opsi: ["Saya sependapat dengan saudara. Mereka akan melakukan segala cara agar tidak kalah saing dengan teman-temannya.", "Pendapat saudara tidak beralasan dan tidak ada buktinya. Saya rasa saudara hanya mengada-ada saja", "Menurut saya, saudara terlalu dini menyimpulkan pendapat tersebut. Padahal belum ada bukti secara akademis atau penelitian secara aktual.", "Saya kurang setuju dengan pendapat saudara. Aplikasi cerpen tersebut mempermudah siswa dalam menyelesaikan tugas-tugas sastra yang diberikan oleh guru"], jawaban: 3 },
    { soal: "Bacalah teks berikut!\n\nRemaja saat ini tumbuh dan hidup di tengah era perkembangan teknologi yang pesat. Di zaman tersebut, orang-orang dapat berkomunikasi meskipun jaraknya jauh. Namun, apakah hal ini akan berdampak ketika mereka dewasa nanti? Terlebih, melalui media sosial, orang dengan mudah memberikan data privasi, nomor telepon, alamat, data keluarga, serta hal privat lain, yang seharusnya tidak diekspos. Siapa saja bisa langsung berkenalan dan berkomunikasi tanpa mengetahui latar belakangnya. Celakanya lagi, berbagai pemahaman dapat dengan mudah masuk ke remaja bila tidak ada pengawasan yang ketat di kehidupan remaja tersebut.\n\nInti paragraf teks diskusi tersebut adalah ...", opsi: ["Remaja saat ini yang tumbuh dan hidup di tengah era perkembangan teknologi.", "Dampak ketika mereka dewasa", "Jejaring sosial", "Orang dapat berkomunikasi walau jauh jaraknya"], jawaban: 0 },
    { soal: "Bacalah kutipan teks diskusi berikut ini!\n\nAkhir-akhir ini tindakan kriminal yang dilakukan oleh pelajar di kota-kota besar sangat memprihatinkan. Mereka tidak hanya bersekolah, tetapi juga melakukan perusakan, perkelahian, bahkan pembajakan sebuah bus. Salah satu pejabat menginstrusikan kepada Kepala Dinas Pendidikan (Disdik) setempat untuk memberikan sanksi kepada para pelajar nakal yang telah melakukan tindakan kriminal. Masyarakat pada umumnya setuju bahwa pelajar yang melakukan tindakan kriminal perlu diberi sanksi. Bentuk sanksi apa yang diberikan? Sampai saat ini masih terjadi perdebatan di kalangan masyarakat.\n\nIsu yang dibahas pada kutipan teks diskusi di atas adalah ...", opsi: ["Sanksi bagi pelajar nakal", "Pendapat masyarakat tentang pelajar nakal", "Nasihat Kepala Dinas Pendidikan", "Tindakan kriminal"], jawaban: 0 },
    { soal: "Bacalah kedua kutipan teks diskusi berikut ini!\n\nTeks I\nJika ingin mengonsumsi teh yang sehat, disarankan untuk mengkonsumsi sebanyak 5 cangkir ukuran 200 ml setiap hari. Karena jumlah tersebut masih batas normal kadar kafein yang bisa dikonsumsi yaitu setara 750 mg/hari. Usahakan juga seduh teh dengan air yang tidak terlalu banyak dan tidak ditambahkan gula mencegah rusaknya zat-zat yang dikandung dan hilangnya manfaat teh. Dalam kebiasaan sehari hari, hindari minum teh saat perut kosong karena bisa meningkatkan produksi asam lambung sehingga berpengaruh pada pencernaan.\n\nTeks II\nDewasa ini beberapa wanita memutuskan untuk berkarier. Namun, adakalanya respons yang diberikan oleh lingkungan sekitar tidak seusai yang dibayangkan, keinginan pribadi wanita terbentur dengan adanya norma dan peraturan. Keputusan untuk menjadi wanita karier tersebut kemudian menimbulkan kontroversi di kalangan masyarakat.\n\nStruktur yang sesuai dengan kedua teks di atas adalah ...", opsi: ["Teks I: Isu dan Teks II: Simpulan", "Teks I: Pro dan Teks II: Kontra", "Teks I: Simpulan dan Teks II: Isu", "Teks I: Kontra dan Teks II: Pro"], jawaban: 2 },

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function renderSoal() {
    const container = document.getElementById('soalContainer');
    container.innerHTML = '';
    const shuffledSoal = shuffleArray([...soalData]);
    shuffledSoal.forEach((item, index) => {
        const opsiAsli = item.opsi.map((teks, i) => ({ teks, indexAsli: i }));
        const opsiAcak = shuffleArray([...opsiAsli]);
        const jawabanBenarIndex = opsiAcak.findIndex(o => o.indexAsli === item.jawaban);
        const soalDiv = document.createElement('div');
        soalDiv.className = 'soal-item';
        soalDiv.innerHTML = `
            <div class="soal-text">
                <span class="soal-number">${index + 1}.</span>
                <span>${item.soal.replace(/\n/g, '<br>')}</span>
            </div>
            <div class="options">
                ${opsiAcak.map((opt, i) => `
                    <label class="option">
                        <input type="radio" name="soal_${index}" value="${i}" data-benar="${jawabanBenarIndex}">
                        <span>${String.fromCharCode(65 + i)}. ${opt.teks}</span>
                    </label>
                `).join('')}
            </div>
        `;
        container.appendChild(soalDiv);
    });
}

function cekJawaban() {
    const soalItems = document.querySelectorAll('.soal-item');
    let benar = 0, salah = 0, kosong = 0;
    soalItems.forEach((item) => {
        const radios = item.querySelectorAll('input[type="radio"]');
        const dipilih = Array.from(radios).find(r => r.checked);
        if (!dipilih) {
            kosong++;
            item.style.borderColor = '#e9eef4';
            item.style.backgroundColor = '#ffffff';
        } else {
            if (dipilih.value === dipilih.dataset.benar) {
                benar++;
                item.style.borderColor = '#1d6b3f';
                item.style.backgroundColor = '#f0fdf4';
            } else {
                salah++;
                item.style.borderColor = '#b13e3e';
                item.style.backgroundColor = '#fef2f2';
            }
        }
    });
    const total = soalItems.length;
    const skor = Math.round((benar / total) * 100);
    const hasilDiv = document.getElementById('hasil');
    hasilDiv.innerHTML = `
        <div class="skor">Skor: ${skor} / 100</div>
        <div>Benar: <span style="color:#1d6b3f;font-weight:700;">${benar}</span> | 
             Salah: <span style="color:#b13e3e;font-weight:700;">${salah}</span> | 
             Kosong: <span style="color:#6a7e96;font-weight:700;">${kosong}</span></div>
        <div style="margin-top:8px;font-size:0.95rem;color:#4a5f7a;">Total ${total} soal</div>
    `;
    hasilDiv.classList.add('show');
}

function acakUlang() {
    renderSoal();
    const hasilDiv = document.getElementById('hasil');
    hasilDiv.classList.remove('show');
    hasilDiv.innerHTML = '';
}

document.getElementById('cekBtn').addEventListener('click', cekJawaban);
document.getElementById('shuffleBtn').addEventListener('click', acakUlang);
renderSoal();
</script>
