<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal Lembaga Keuangan & Literasi Finansial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e2e9f2 100%);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
            padding: 32px 28px;
            border: 1px solid #ffffff80;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #1a2e4b;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .subhead {
            text-align: center;
            color: #4a5f7a;
            margin-bottom: 28px;
            font-size: 1rem;
            border-bottom: 2px dashed #b8c9dd;
            padding-bottom: 16px;
        }
        .soal-item {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 22px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0, 20, 30, 0.04);
            border: 1px solid #e9eef4;
            transition: all 0.1s;
        }
        .soal-item:hover {
            border-color: #b7c9e0;
            box-shadow: 0 6px 14px rgba(0, 40, 70, 0.06);
        }
        .soal-text {
            font-weight: 600;
            color: #0b1e33;
            margin-bottom: 12px;
            font-size: 1rem;
            line-height: 1.4;
            display: flex;
            gap: 8px;
        }
        .soal-number {
            color: #2c5f9a;
            font-weight: 700;
            min-width: 26px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding-left: 6px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: #1e2f44;
            cursor: pointer;
            padding: 6px 12px 6px 8px;
            border-radius: 40px;
            transition: background 0.15s;
            border: 1px solid transparent;
        }
        .option:hover {
            background: #eef4fd;
            border-color: #c7d9f0;
        }
        .option input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #8aa0bc;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            flex-shrink: 0;
            cursor: pointer;
        }
        .option input[type="radio"]:checked {
            border-color: #1f6ed4;
            background: #1f6ed4;
            box-shadow: inset 0 0 0 4px white;
        }
        .option input[type="radio"]:focus-visible {
            outline: 2px solid #1f6ed4;
            outline-offset: 2px;
        }
        .btn-cek {
            display: block;
            width: 100%;
            margin-top: 32px;
            padding: 18px 10px;
            background: #1a3f66;
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            letter-spacing: 0.3px;
            box-shadow: 0 12px 24px -8px #1a3f6690;
            transition: all 0.2s ease;
            border: 1px solid #ffffff30;
        }
        .btn-cek:hover {
            background: #0f2d4b;
            transform: scale(1.01);
            box-shadow: 0 18px 28px -8px #0f2d4bcc;
        }
        .btn-cek:active {
            transform: scale(0.99);
        }
        .hasil {
            margin-top: 24px;
            padding: 18px 22px;
            border-radius: 20px;
            background: #eaf1fb;
            border-left: 6px solid #1f6ed4;
            font-weight: 500;
            color: #0b2a46;
            display: none;
            font-size: 1.05rem;
        }
        .hasil.show {
            display: block;
        }
        .skor {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0a2b4b;
            margin-bottom: 8px;
        }
        .detail-benar {
            color: #1d6b3f;
            font-weight: 600;
        }
        .detail-salah {
            color: #b13e3e;
            font-weight: 600;
        }
        .footer-note {
            margin-top: 18px;
            text-align: center;
            color: #6a7e96;
            font-size: 0.85rem;
        }
        .badge {
            background: #ffffff;
            border-radius: 40px;
            padding: 4px 10px;
            font-size: 0.8rem;
            color: #2a4b72;
        }
        @media (max-width: 600px) {
            .container { padding: 22px 16px; }
            h1 { font-size: 1.5rem; }
            .soal-item { padding: 14px 16px; }
            .options { flex-direction: column; gap: 4px; }
            .option { padding: 6px 8px; }
        }
    </style>
</head>

        { soal: "Pernyataan yang benar tentang keuangan adalah...", opsi: ["Menabung lebih baik daripada berutang untuk konsumsi", "Semua utang itu buruk", "Menabung tidak berguna", "Keuangan urusan orang dewasa saja"], jawaban: 0 },
        { soal: "Sikap kritis terhadap tawaran investasi dengan keuntungan luar biasa cepat adalah...", opsi: ["Waspada, kemungkinan penipuan", "Langsung ikut agar kaya", "Mengajak semua teman ikut", "Meminjam uang untuk ikut"], jawaban: 0 },
        { soal: "Membagikan uang saku ke amplop berbeda (makan, tabungan, sumbangan) adalah contoh…", opsi: ["Penganggaran Sederhana", "Menghabiskan Uang", "Menyembunyikan Uang", "Membagi Uang ke Teman"], jawaban: 0 },
        { soal: "Tujuan akhir mempelajari literasi finansial adalah...", opsi: ["Mencapai kesejahteraan hidup secara mandiri", "Menjadi orang terkaya di dunia", "Tidak perlu berbagi dengan orang lain", "Menghindari semua pengeluaran"], jawaban: 0 }
    ];

    const container = document.getElementById('soalContainer');
    const form = document.getElementById('kuisForm');
    const hasilDiv = document.getElementById('hasil');
    const cekBtn = document.getElementById('cekBtn');

    // Render soal
    function renderSoal() {
        let html = '';
        soalData.forEach((item, index) => {
            const nomor = index + 1;
            html += `<div class="soal-item" data-index="${index}">`;
            html += `<div class="soal-text"><span class="soal-number">${nomor}.</span> ${item.soal}</div>`;
            html += `<div class="options">`;
            item.opsi.forEach((opsi, optIdx) => {
                const label = String.fromCharCode(65 + optIdx); // A, B, C, D
                html += `<label class="option">
                            <input type="radio" name="q${index}" value="${optIdx}" data-qindex="${index}">
                            <span>${label}. ${opsi}</span>
                         </label>`;
            });
            html += `</div></div>`;
        });
        container.innerHTML = html;
    }

    // Cek jawaban
    function cekJawaban() {
        const inputs = form.querySelectorAll('input[type="radio"]:checked');
        const jawabanUser = {};
        inputs.forEach(input => {
            const qIndex = parseInt(input.dataset.qindex);
            jawabanUser[qIndex] = parseInt(input.value);
        });

        let benar = 0;
        let total = soalData.length;

        soalData.forEach((item, idx) => {
            const userAns = jawabanUser[idx];
            if (userAns !== undefined && userAns === item.jawaban) {
                benar++;
            }
        });

        const persen = Math.round((benar / total) * 100);
        let pesan = '';
        if (persen >= 90) pesan = '🌟 Luar biasa! Pemahamanmu sangat baik.';
        else if (persen >= 70) pesan = '👍 Bagus! Tingkatkan lagi sedikit.';
        else if (persen >= 50) pesan = '📖 Cukup baik, pelajari kembali materi yang belum dikuasai.';
        else pesan = '💪 Jangan menyerah! Coba baca ulang materi dan kerjakan lagi.';

        let detailHtml = `<div class="skor">Skor: ${benar} / ${total} (${persen}%)</div>`;
        detailHtml += `<div>${pesan}</div>`;

        // Daftar jawaban benar vs salah per nomor
        let rincian = '<div style="margin-top:14px;font-size:0.95rem;"><strong>Rincian jawaban:</strong><ul style="margin-top:8px; list-style:none; display:flex; flex-wrap:wrap; gap:6px 14px;">';
        soalData.forEach((item, idx) => {
            const userAns = jawabanUser[idx];
            const isCorrect = (userAns !== undefined && userAns === item.jawaban);
            const statusClass = isCorrect ? 'detail-benar' : 'detail-salah';
            const statusText = isCorrect ? '✓' : '✗';
            const nomor = idx + 1;
            rincian += `<li class="${statusClass}" style="font-size:0.9rem;">${nomor}. ${statusText}</li>`;
        });
        rincian += '</ul></div>';

        hasilDiv.innerHTML = detailHtml + rincian;
        hasilDiv.classList.add('show');
    }

    // Event listener
    cekBtn.addEventListener('click', (e) => {
        e.preventDefault();
        cekJawaban();
        // Scroll ke hasil
        hasilDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // Inisialisasi
    renderSoal();

    // Opsional: reset hasil jika ada perubahan jawaban
    form.addEventListener('change', () => {
        hasilDiv.classList.remove('show');
        hasilDiv.innerHTML = '';
    });

    // Mencegah form submit reload
    form.addEventListener('submit', (e) => e.preventDefault());
</script>
</body>
</html>
