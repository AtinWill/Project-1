<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal Teks Diskusi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e2e9f2 100%);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
            padding: 32px 28px;
            border: 1px solid #ffffff80;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #1a2e4b;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .subhead {
            text-align: center;
            color: #4a5f7a;
            margin-bottom: 28px;
            font-size: 1rem;
            border-bottom: 2px dashed #b8c9dd;
            padding-bottom: 16px;
        }
        .soal-item {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 22px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0, 20, 30, 0.04);
            border: 1px solid #e9eef4;
            transition: all 0.1s;
        }
        .soal-item:hover {
            border-color: #b7c9e0;
            box-shadow: 0 6px 14px rgba(0, 40, 70, 0.06);
        }
        .soal-text {
            font-weight: 600;
            color: #0b1e33;
            margin-bottom: 12px;
            font-size: 1rem;
            line-height: 1.4;
            display: flex;
            gap: 8px;
        }
        .soal-number {
            color: #2c5f9a;
            font-weight: 700;
            min-width: 26px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding-left: 6px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: #1e2f44;
            cursor: pointer;
            padding: 6px 12px 6px 8px;
            border-radius: 40px;
            transition: background 0.15s;
            border: 1px solid transparent;
        }
        .option:hover {
            background: #eef4fd;
            border-color: #c7d9f0;
        }
        .option input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #8aa0bc;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            flex-shrink: 0;
            cursor: pointer;
        }
        .option input[type="radio"]:checked {
            border-color: #1f6ed4;
            background: #1f6ed4;
            box-shadow: inset 0 0 0 4px white;
        }
        .option input[type="radio"]:focus-visible {
            outline: 2px solid #1f6ed4;
            outline-offset: 2px;
        }
        .btn-cek {
            display: block;
            width: 100%;
            margin-top: 32px;
            padding: 18px 10px;
            background: #1a3f66;
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            letter-spacing: 0.3px;
            box-shadow: 0 12px 24px -8px #1a3f6690;
            transition: all 0.2s ease;
            border: 1px solid #ffffff30;
        }
        .btn-cek:hover {
            background: #0f2d4b;
            transform: scale(1.01);
            box-shadow: 0 18px 28px -8px #0f2d4bcc;
        }
        .btn-cek:active {
            transform: scale(0.99);
        }
        .hasil {
            margin-top: 24px;
            padding: 18px 22px;
            border-radius: 20px;
            background: #eaf1fb;
            border-left: 6px solid #1f6ed4;
            font-weight: 500;
            color: #0b2a46;
            display: none;
            font-size: 1.05rem;
        }
        .hasil.show {
            display: block;
        }
        .skor {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0a2b4b;
            margin-bottom: 8px;
        }
        .footer-note {
            margin-top: 18px;
            text-align: center;
            color: #6a7e96;
            font-size: 0.85rem;
        }
        .btn-shuffle {
            display: block;
            width: 100%;
            margin-top: 14px;
            padding: 12px 10px;
            background: #eaf1fb;
            color: #1a3f66;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid #c2d6ef;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-shuffle:hover {
            background: #d8e6fa;
            border-color: #9ebde3;
        }
        @media (max-width: 600px) {
            .container { padding: 22px 16px; }
            h1 { font-size: 1.5rem; }
            .soal-item { padding: 14px 16px; }
            .options { flex-direction: column; gap: 4px; }
            .option { padding: 6px 8px; }
        }
    </style>
</head>

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ==================== RENDER SOAL ====================
    function renderSoal() {
        const container = document.getElementById('soalContainer');
        container.innerHTML = '';

        const shuffledSoal = shuffleArray([...soalData]);

        shuffledSoal.forEach((item, index) => {
            const opsiAsli = item.opsi.map((teks, i) => ({ teks, indexAsli: i }));
            const opsiAcak = shuffleArray([...opsiAsli]);
            
            const jawabanBenarIndex = opsiAcak.findIndex(o => o.indexAsli === item.jawaban);

            const soalDiv = document.createElement('div');
            soalDiv.className = 'soal-item';
            soalDiv.innerHTML = `
                <div class="soal-text">
                    <span class="soal-number">${index + 1}.</span>
                    <span>${item.soal}</span>
                </div>
                <div class="options">
                    ${opsiAcak.map((opt, i) => `
                        <label class="option">
                            <input type="radio" name="soal_${index}" value="${i}" data-benar="${jawabanBenarIndex}">
                            <span>${String.fromCharCode(65 + i)}. ${opt.teks}</span>
                        </label>
                    `).join('')}
                </div>
            `;
            container.appendChild(soalDiv);
        });
    }

    // ==================== CEK JAWABAN ====================
    function cekJawaban() {
        const soalItems = document.querySelectorAll('.soal-item');
        let benar = 0;
        let salah = 0;
        let kosong = 0;

        soalItems.forEach((item) => {
            const radios = item.querySelectorAll('input[type="radio"]');
            const dipilih = Array.from(radios).find(r => r.checked);
            
            if (!dipilih) {
                kosong++;
                item.style.borderColor = '#e9eef4';
                item.style.backgroundColor = '#ffffff';
            } else {
                const jawabanBenar = dipilih.dataset.benar;
                const jawabanUser = dipilih.value;
                if (jawabanUser === jawabanBenar) {
                    benar++;
                    item.style.borderColor = '#1d6b3f';
                    item.style.backgroundColor = '#f0fdf4';
                } else {
                    salah++;
                    item.style.borderColor = '#b13e3e';
                    item.style.backgroundColor = '#fef2f2';
                }
            }
        });

        const total = soalItems.length;
        const skor = Math.round((benar / total) * 100);
        
        const hasilDiv = document.getElementById('hasil');
        hasilDiv.innerHTML = `
            <div class="skor">Skor: ${skor} / 100</div>
            <div>Benar: <span style="color:#1d6b3f;font-weight:700;">${benar}</span> | 
                 Salah: <span style="color:#b13e3e;font-weight:700;">${salah}</span> | 
                 Kosong: <span style="color:#6a7e96;font-weight:700;">${kosong}</span></div>
            <div style="margin-top:8px;font-size:0.95rem;color:#4a5f7a;">Total ${total} soal</div>
        `;
        hasilDiv.classList.add('show');
    }

    // ==================== ACAK ULANG ====================
    function acakUlang() {
        renderSoal();
        document.getElementById('hasil').classList.remove('show');
        document.getElementById('hasil').innerHTML = '';
        document.querySelectorAll('.soal-item').forEach(item => {
            item.style.borderColor = '#e9eef4';
            item.style.backgroundColor = '#ffffff';
        });
    }

    // ==================== EVENT LISTENER ====================
    document.getElementById('cekBtn').addEventListener('click', cekJawaban);
    document.getElementById('shuffleBtn').addEventListener('click', acakUlang);

    // Render awal
    renderSoal();
</script>
</body>
</html>
